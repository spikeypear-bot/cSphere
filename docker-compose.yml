services:
  db:
    image: postgres:latest
    container_name: postgres-db
    volumes:
      # Postgres 18+ wants the mount at this parent path; it stores PGDATA in a
      # version-named subdirectory so pg_upgrade works across image bumps.
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres
      POSTGRES_DB: csphere
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: csphere-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      # List form, not map form, so the bare JWT_SECRET entry below works: it
      # forwards the host's value only if the host actually has one set, leaving
      # application-dev.properties' committed dev key in place otherwise. A map
      # entry would forward an empty string and override that default with "".
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/csphere
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Runs the backend test suite with a throwaway JDK container, so no local Java
  # is needed. backend/ is bind-mounted (no image build), and Maven downloads are
  # cached in m2cache. The profile keeps it out of a plain `docker compose up`.
  # Usage: docker compose run --rm backend-test [maven args, default: test]
  backend-test:
    image: eclipse-temurin:25-jdk
    profiles: ["test"]
    working_dir: /build
    volumes:
      - ./backend:/build
      - m2cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/csphere
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET
    entrypoint: ["./mvnw", "-B", "-ntp"]
    command: ["test"]

volumes:
  pgdata:
  m2cache:
