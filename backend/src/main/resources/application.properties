spring.application.name=connect-sphere
spring.profiles.active=dev

#server port 
server.port=8080



#jpa/hibernate 
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

#flyway for migration
spring.flyway.enabled=true

#jwt — HS256, one shared secret that both signs and verifies.
# No default on purpose: any profile other than dev must supply JWT_SECRET or the
# app refuses to start, rather than booting with a guessable key. The dev profile
# overrides this with a committed throwaway (see application-dev.properties).
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=connect-sphere
# Short on purpose. A stateless token cannot be revoked, so its lifetime is the
# only thing bounding the damage of a stolen one. Tolerable for users only once
# refresh tokens exist (stage 6) — do not "fix" an expiry complaint by raising it.
security.jwt.access-token-ttl=15m
# Long, because this is what keeps a user logged in — and safe to be long only
# because it is opaque, single-use and stored server-side, so it can actually be
# revoked. Never give an access token a lifetime like this.
security.jwt.refresh-token-ttl=14d
