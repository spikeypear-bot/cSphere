#lazy-init
spring.main.lazy-initialization=true

#jdbc driver for db
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/csphere
spring.datasource.username=postgres
spring.datasource.password=root

#jwt signing key for local development
# Committed on purpose, exactly like DevUserSeeder's "123456" — a fixed key means
# tokens survive a restart, and @Profile/profile-specific config is what keeps it
# out of anywhere real. Set JWT_SECRET in the environment to override it.
# HS256 needs at least 256 bits: generate a replacement with
#   openssl rand -base64 32
security.jwt.secret=${JWT_SECRET:jgEAE4dL5XqF/ufOs+jj2kKbUgsrp706PFM7bqBd3/4=}
